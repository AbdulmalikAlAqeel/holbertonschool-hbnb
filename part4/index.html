<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB - Places</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html">
                <img src="images/logo.png" alt="HBnB Logo" class="logo">
            </a>
            <a href="login.html" id="login-link" class="login-button">Login</a>
        </nav>
    </header>

    <main>
        <h1>Available Places</h1>

        <section class="filter-section">
            <label for="price-filter">Max Price:</label>
            <select id="price-filter">
                <option value="10">10</option>
                <option value="50">50</option>
                <option value="100">100</option>
                <option value="all" selected>All</option>
            </select>
        </section>

        <section id="places-list" class="places-list">
        </section>
    </main>

    <footer>
        <p>&copy; 2026 HBnB. All rights reserved.</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
